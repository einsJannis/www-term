<!doctype html>
<html lang="en">
    <head>
        <title>Console</title>
        <link rel="stylesheet" type="text/css" href="/style/terminal.css" />
    </head>
    <body>
        <main id="terminal" />
        <script type="module">
            import { Terminal } from "/script/terminal.js";
            import { Shell } from "/script/shell.js";
            import {
                File,
                Directory,
                getDefaultFileSystem,
            } from "/script/filesystem.js";
            const terminal = new Terminal(document.getElementById("terminal"));
            const root = getDefaultFileSystem();
            const homeDirectory = root.children
                .getChild("home")
                .getChild("einsjannis");
            const shell = new Shell(terminal, root, homeDirectory);
            shell.run();
        </script>
    </body>
</html>
