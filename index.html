<!doctype html>
<html lang="en">
    <head>
        <title>Console</title>
        <link rel="stylesheet" type="text/css" href="/style/terminal.css" />
    </head>
    <body>
        <main id="terminal" />
        <script type="module">
            import { Terminal } from "/script/terminal.js";
            import { Shell } from "/script/shell.js";
            const terminal = new Terminal(document.getElementById("terminal"));
            const shell = new Shell(terminal);
            shell.run();
        </script>
    </body>
</html>
